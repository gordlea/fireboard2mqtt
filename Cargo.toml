[package]
name = "fireboard2mqtt"
version = "3.3.0"
edition = "2021"
publish = false

[features]
default = []
pretty_print_json_logs = []

[dependencies]
anyhow = "1.0.104"
tokio = { version = "1.53.3", features = ["full"] }
log = "0.4.34"
env_logger = "0.11.11"
url = "2.5.8"
serde = { version = "1.0.229", features = ["derive"]}
serde_json = { version = "1.0.154" }
rumqttc = "0.25.1"
rustls-native-certs = "0.8.3"
bytes = "1.12.1"
memory-stats = "1.2.0"
human_bytes = { version = "0.4", default-features = false }
serde_repr = "0.1.21"
reqwest = { version = "0.13.5", default-features = false, features = ["default-tls", "charset", "json"] }
chrono = { version = "0.4.45", default-features = false, features = [
    "std",
    "serde",
    "clock"
]}
twelf = { version = "0.15.0", default-features = false, features = ["env", "default_trait"]}
strum = { version = "0.28.0", features = ["derive"] }
constcat = "0.6.1"

[profile.dev]
debug = true
opt-level = 0
lto = "off"
panic = "unwind"
strip = false

[profile.release]
debug = 0
strip = true
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
