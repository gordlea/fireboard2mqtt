name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    # release.yml repeats these steps as its `test` job for edge builds from main; keep both in sync.
    name: cargo test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings

  docker:
    name: docker build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [standalone, addon]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/amd64-base-debian:trixie
            BUILD_ARCH=amd64
            BUILD_VERSION=ci
          cache-from: type=gha,scope=ci-amd64
          cache-to: type=gha,scope=ci-amd64,mode=max
