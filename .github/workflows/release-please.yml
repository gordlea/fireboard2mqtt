on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # A PAT (not GITHUB_TOKEN) so that the release it publishes triggers release.yml.
          token: ${{ secrets.RELEASE_PLEASE_GITHUB_TOKEN }}
          # Package settings live in release-please-config.json / .release-please-manifest.json;
          # that is what lets it bump addon/config.yaml alongside Cargo.toml.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
